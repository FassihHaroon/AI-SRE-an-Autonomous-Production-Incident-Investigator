[project]
name = "ai-sre-backend"
version = "0.1.0"
description = "AI SRE API, agent worker and integrations"
requires-python = ">=3.13"
dependencies = [
    # API
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    # Data
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "redis>=8.2",
    "pyyaml>=6.0",
    "fastembed>=0.7",
    "pypdf>=5.0",
    # Observability
    "structlog>=26.1",
    # AI (agent graph is built in a later phase; dependencies pinned now so the
    # workspace lock and Docker image are stable)
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary]>=3.2",
    "mcp>=2.3",
    "google-genai>=3.6",
    "opentelemetry-sdk>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sre"]
