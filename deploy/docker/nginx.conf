# Serves the SPA and proxies /api to the backend container.
# Note: a location block that uses add_header stops inheriting server-level add_header
# directives. Locations below use `expires` (not add_header) so security headers apply everywhere.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Container liveness (the web server itself; backend readiness is shown in the UI).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Investigation progress streams over SSE (/api/v1/investigations/{id}/events):
        # no buffering; the API sends a keep-alive every 15 s, well inside the read timeout.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~ \.map$ {
        return 404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
