# Prometheus for the SIMULATED production environment.
# Every series gets service + environment labels at scrape time. The chaos controller,
# toxiproxy, the payments provider (a "third party") and the load generator are NOT scraped:
# an investigator sees symptoms, never the injected faults.

global:
  scrape_interval: 5s        # short so scenarios show up quickly; real setups use 15-30s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]
        labels: {service: api-gateway, environment: simulated-prod}

  - job_name: orders-service
    static_configs:
      - targets: ["orders-service:8000"]
        labels: {service: orders-service, environment: simulated-prod}

  - job_name: fulfilment-worker
    static_configs:
      - targets: ["fulfilment-worker:9100"]
        labels: {service: fulfilment-worker, environment: simulated-prod}

  - job_name: deployer
    static_configs:
      - targets: ["deployer:8000"]
        labels: {service: deployer, environment: simulated-prod}

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: {service: postgres, environment: simulated-prod}

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: {service: redis, environment: simulated-prod}
