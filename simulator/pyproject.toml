[project]
name = "ai-sre-simulator"
version = "0.1.0"
description = "Deterministic production simulator and MCP tool servers for AI SRE"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sre_simulator"]
