[project]
name = "ai-sre"
version = "0.1.0"
description = "AI SRE — autonomous production incident investigator (workspace root)"
requires-python = ">=3.13"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "simulator", "evals"]

[tool.uv.sources]
ai-sre-backend = { workspace = true }
ai-sre-simulator = { workspace = true }
ai-sre-evals = { workspace = true }

[dependency-groups]
dev = [
    "ai-sre-backend",
    "ai-sre-simulator",
    "ai-sre-evals",
    "mypy>=2.4",
    "poethepoet>=0.49",
    "pre-commit>=4.0",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "httpx>=0.28",
    "ruff>=0.17",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["frontend", "docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "ASYNC",         # async pitfalls
    "SIM", "RUF", "PT", "N", "C4", "DTZ",
]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["ai_sre", "ai_sre_simulator", "ai_sre_evals"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "PT011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["backend/src", "simulator/src", "evals/src"]
packages = ["ai_sre", "ai_sre_simulator", "ai_sre_evals"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["backend/tests", "simulator/tests"]
addopts = "--import-mode=importlib -m 'not integration' -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs running Postgres and Redis (docker compose up postgres redis)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# ---------------------------------------------------------------- tasks (uv run poe <task>)
[tool.poe.tasks]
# --- Python
fmt-py = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }]
lint-py = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "mypy" },
]
test-py = { cmd = "pytest", help = "Unit tests (no external services needed)" }
test-integration = { cmd = "pytest -m integration", help = "Needs: docker compose up -d postgres redis" }
api = { cmd = "uvicorn ai_sre.main:app --reload --port 8010", help = "Run the API locally with reload" }
migrate = { cmd = "alembic -c backend/alembic.ini upgrade head", help = "Apply DB migrations" }
llm-smoke = { cmd = "python -m ai_sre.integrations.llm", help = "Send one prompt to the configured LLM provider" }

# --- Frontend (scripts/npm.py resolves npm portably; it is a .cmd shim on Windows)
web = { cmd = "python scripts/npm.py run dev", help = "Run the Vite dev server" }
fmt-web = { cmd = "python scripts/npm.py run format" }
lint-web = [
    { cmd = "python scripts/npm.py run lint" },
    { cmd = "python scripts/npm.py run typecheck" },
    { cmd = "python scripts/npm.py run format:check" },
]
test-web = { cmd = "python scripts/npm.py test" }

# --- Aggregates
fmt = { sequence = ["fmt-py", "fmt-web"], help = "Format everything" }
lint = { sequence = ["lint-py", "lint-web"], help = "Lint + type-check everything" }
test = { sequence = ["test-py", "test-web"], help = "Run all unit tests" }
check = { sequence = ["lint", "test"], help = "What CI runs (minus Docker)" }

# --- Docker
up = { cmd = "docker compose up -d --build", help = "Build and start the stack" }
down = { cmd = "docker compose down", help = "Stop the stack (keeps volumes)" }
logs = { cmd = "docker compose logs -f --tail 200" }
ps = { cmd = "docker compose ps" }
