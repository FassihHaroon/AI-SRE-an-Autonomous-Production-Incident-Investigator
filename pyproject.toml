[project]
name = "ai-sre"
version = "0.1.0"
description = "AI SRE — autonomous production incident investigator (workspace root)"
requires-python = ">=3.13"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "simulator", "evals"]

[tool.uv.sources]
ai-sre-backend = { workspace = true }
ai-sre-simulator = { workspace = true }
ai-sre-evals = { workspace = true }

[dependency-groups]
dev = [
    "ai-sre-backend",
    "ai-sre-simulator",
    "ai-sre-evals",
    "mypy>=2.4",
    "poethepoet>=0.49",
    "pre-commit>=4.0",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "httpx>=0.28",
    "jsonschema>=4.26",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12.20261122",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["frontend", "docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "ASYNC",         # async pitfalls
    "SIM", "RUF", "PT", "N", "C4", "DTZ",
]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["ai_sre", "ai_sre_simulator", "ai_sre_evals"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "PT011"]
# Seed SQL is an f-string built from integer module constants only.
"simulator/src/ai_sre_simulator/shop/seed.py" = ["S608"]
# MCP tool modules embed long PromQL/SQL literals that read worse when split.
"backend/src/ai_sre/mcp_servers/*.py" = ["E501"]
"backend/src/ai_sre/agent/*.py" = ["E501"]
"backend/src/ai_sre/knowledge/*.py" = ["E501"]
"backend/src/ai_sre/services/repository.py" = ["E501"]
"backend/src/ai_sre/api/routes/*.py" = ["E501"]
"backend/tests/agent/*.py" = ["E501"]
"backend/tests/knowledge/*.py" = ["E501"]
"evals/src/ai_sre_evals/*.py" = ["E501"]
"evals/tests/*.py" = ["E501", "PT018"]
"backend/tests/agent/test_tracing.py" = ["E501", "F811"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["backend/src", "simulator/src", "evals/src"]
packages = ["ai_sre", "ai_sre_simulator", "ai_sre_evals"]
warn_unreachable = true

[[tool.mypy.overrides]]
# asyncpg ships no type information (no py.typed / stubs).
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["backend/tests", "simulator/tests", "evals/tests"]
addopts = "--import-mode=importlib -m 'not integration and not sim' -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs running Postgres and Redis (docker compose up postgres redis)",
    "sim: needs the running simulated environment (docker compose -f docker-compose.sim.yml up)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# ---------------------------------------------------------------- tasks (uv run poe <task>)
[tool.poe.tasks]
# --- Python
fmt-py = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }]
lint-py = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "mypy" },
]
test-py = { cmd = "pytest", help = "Unit tests (no external services needed)" }
test-integration = { cmd = "pytest -m integration", help = "Needs: docker compose up -d postgres redis" }
api = { cmd = "python -m ai_sre.api --port 8010", help = "Run the API locally (selector event loop on Windows for the Postgres checkpointer)" }
api-reload = { cmd = "uvicorn ai_sre.main:app --reload --port 8010", help = "API with auto-reload (Linux/macOS; on Windows the checkpointer falls back to memory)" }
migrate = { cmd = "alembic -c backend/alembic.ini upgrade head", help = "Apply DB migrations" }
llm-smoke = { cmd = "python -m ai_sre.integrations.llm", help = "Send one prompt to the configured LLM provider" }

# --- Frontend (scripts/npm.py resolves npm portably; it is a .cmd shim on Windows)
web = { cmd = "python scripts/npm.py run dev", help = "Run the Vite dev server" }
fmt-web = { cmd = "python scripts/npm.py run format" }
lint-web = [
    { cmd = "python scripts/npm.py run lint" },
    { cmd = "python scripts/npm.py run typecheck" },
    { cmd = "python scripts/npm.py run format:check" },
]
test-web = { cmd = "python scripts/npm.py test" }

# --- Aggregates
fmt = { sequence = ["fmt-py", "fmt-web"], help = "Format everything" }
lint = { sequence = ["lint-py", "lint-web"], help = "Lint + type-check everything" }
test = { sequence = ["test-py", "test-web"], help = "Run all unit tests" }
check = { sequence = ["lint", "test"], help = "What CI runs (minus Docker)" }

# --- Docker
up = { cmd = "docker compose up -d --build", help = "Build and start the stack" }
down = { cmd = "docker compose down", help = "Stop the stack (keeps volumes)" }
logs = { cmd = "docker compose logs -f --tail 200" }
ps = { cmd = "docker compose ps" }

# --- Simulated production environment (docker-compose.sim.yml; see docs/simulator.md)
sim-up = { cmd = "docker compose -f docker-compose.sim.yml up -d --build --wait", help = "Build and start the SIMULATED environment" }
sim-down = { cmd = "docker compose -f docker-compose.sim.yml down", help = "Stop the simulated environment (keeps volumes)" }
sim-ps = { cmd = "docker compose -f docker-compose.sim.yml ps" }
sim-logs = { cmd = "docker compose -f docker-compose.sim.yml logs -f --tail 100" }
sim-reset = { cmd = "python scripts/sim_reset.py", help = "Clear all incidents, restore baseline deployments, drain queues" }
sim-reset-hard = { cmd = "python scripts/sim_reset.py --hard", help = "Recreate the simulated environment from scratch (deletes its volumes)" }
mcp = { cmd = "python -m ai_sre.mcp_servers serve", help = "Run the MCP servers on http://127.0.0.1:8300 (needs sim-up)" }
kb-ingest = { cmd = "python -m ai_sre.knowledge ingest", help = "Ingest knowledge/ into PostgreSQL (idempotent; --prune to delete removed files)" }
kb-eval = { cmd = "python -m ai_sre.knowledge evaluate --output docs/eval-results/retrieval.md", help = "Retrieval metrics (Recall@K, Precision@K, MRR, nDCG)" }
test-agent-e2e = { cmd = "pytest -m sim backend/tests/agent -v", help = "Investigation graph end to end against the simulated environment (~15 min)" }
investigate = { cmd = "python -m ai_sre.agent investigate", help = "Run an investigation: uv run poe investigate \"<question>\"" }
test-mcp = { cmd = "pytest -m sim backend/tests/mcp -v", help = "Protocol-level MCP tests against the running simulated environment" }
test-sim = { cmd = "pytest -m sim simulator/tests/live -v", help = "Live tests: trigger every scenario/fault, assert metrics + logs (needs sim-up; ~20 min)" }
