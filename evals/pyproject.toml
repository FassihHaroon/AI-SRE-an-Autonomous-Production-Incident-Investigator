[project]
name = "ai-sre-evals"
version = "0.1.0"
description = "Evaluation harness for AI SRE (scenario suites, ground truth, metrics)"
requires-python = ">=3.13"
dependencies = ["ai-sre-backend"]

[tool.uv.sources]
ai-sre-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sre_evals", "src/evaluation"]
