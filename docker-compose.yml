# AI SRE local stack.  Usage:  cp .env.example .env  →  docker compose up -d --build
# Host ports bind to 127.0.0.1 only and can be changed in .env if they clash.

name: ai-sre

x-backend-env: &backend-env
  AI_SRE_ENVIRONMENT: ${AI_SRE_ENVIRONMENT:-development}
  AI_SRE_LOG_LEVEL: ${AI_SRE_LOG_LEVEL:-INFO}
  AI_SRE_LOG_FORMAT: json
  AI_SRE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aisre}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aisre}
  AI_SRE_REDIS_URL: redis://redis:6379/0
  AI_SRE_LLM_PROVIDER: ${AI_SRE_LLM_PROVIDER:-gemini}
  AI_SRE_GEMINI_API_KEY: ${AI_SRE_GEMINI_API_KEY:-}
  AI_SRE_GEMINI_MODEL: ${AI_SRE_GEMINI_MODEL:-gemini-3.5-flash-lite}

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aisre}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies database migrations, then exits. The API waits for it.
  migrate:
    image: ai-sre-backend:dev  # built by the `api` service
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    image: ai-sre-backend:dev
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # The image defines a HEALTHCHECK on /healthz (liveness).
    restart: unless-stopped

  # MCP tool servers (Phase 3). They investigate the SIMULATED environment
  # (docker-compose.sim.yml) through its published monitoring ports on the host.
  mcp:
    image: ai-sre-backend:dev
    pull_policy: never
    command: ["python", "-m", "ai_sre.mcp_servers", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
      AI_SRE_MCP_PROMETHEUS_URL: http://host.docker.internal:${SIM_PROMETHEUS_PORT:-9090}
      AI_SRE_MCP_LOKI_URL: http://host.docker.internal:${SIM_LOKI_PORT:-3100}
      AI_SRE_MCP_DEPLOYER_URL: http://host.docker.internal:${SIM_DEPLOYER_PORT:-8202}
      AI_SRE_MCP_ORCHESTRATOR_URL: http://host.docker.internal:${SIM_CHAOS_PORT:-8210}
      AI_SRE_MCP_DATABASE_DSN: postgresql://sre_readonly:${SIM_SRE_READONLY_PASSWORD:-sre-readonly-sim}@host.docker.internal:${SIM_POSTGRES_PORT:-55432}/shop
      AI_SRE_MCP_READ_TOKEN: ${AI_SRE_MCP_READ_TOKEN:-dev-mcp-read-token}
      AI_SRE_MCP_REMEDIATION_TOKEN: ${AI_SRE_MCP_REMEDIATION_TOKEN:-dev-mcp-remediation-token}
      AI_SRE_MCP_ADMIN_TOKEN: ${AI_SRE_MCP_ADMIN_TOKEN:-dev-mcp-admin-token}
      AI_SRE_MCP_APPROVAL_SECRET: ${AI_SRE_MCP_APPROVAL_SECRET:-dev-mcp-approval-secret-change-me}
      AI_SRE_MCP_REMEDIATION_ENABLED: ${AI_SRE_MCP_REMEDIATION_ENABLED:-false}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8300}:8000"
    depends_on:
      api:
        condition: service_started   # same image; built by `api`
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    image: ai-sre-web:dev
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8090}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
